<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video World — Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f8f9fa;--card:#fff;--border:#e2e5e9;--text:#1a1a2e;--muted:#7a7a96;--accent:#4f46e5;--red:#dc2626}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Inter,sans-serif;background:var(--bg);color:var(--text)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem;width:100%;max-width:380px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
h1{font-size:1.25rem;font-weight:800;margin-bottom:.35rem}
.sub{color:var(--muted);font-size:.85rem;margin-bottom:1.4rem}
label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:.3rem;margin-top:1rem}
input{width:100%;border:1px solid var(--border);border-radius:8px;padding:.6rem .7rem;font-size:.95rem;font-family:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{width:100%;margin-top:1.4rem;border:none;background:var(--accent);color:#fff;border-radius:8px;padding:.7rem;font-weight:700;font-size:.95rem;cursor:pointer;font-family:inherit}
button:hover{opacity:.92}
.err{color:var(--red);font-size:.8rem;margin-top:.7rem;min-height:1em}
</style>
</head>
<body>
  <div class="card">
    <h1>Video World Labeling</h1>
    <p class="sub">Enter the access passcode shared with you, and pick a display name.</p>
    <form id="gateForm">
      <label for="name">Your name</label>
      <input id="name" autocomplete="name" placeholder="e.g. alex" required maxlength="60">
      <label for="pass">Access passcode</label>
      <input id="pass" type="password" autocomplete="off" required>
      <button type="submit">Continue</button>
      <p class="err" id="err"></p>
    </form>
  </div>
<script src="config.js"></script>
<script src="vgp.js"></script>
<script>
const params = new URLSearchParams(location.search);
const next = params.get('next') || 'index.html';

const nameEl = document.getElementById('name');
const passEl = document.getElementById('pass');
nameEl.value = VGP.getRater();

document.getElementById('gateForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = nameEl.value.trim();
  const pass = passEl.value;
  const err = document.getElementById('err');
  if (!name){ err.textContent = 'Please enter a name.'; return; }
  if (pass !== CONFIG.ACCESS_PASSCODE){ err.textContent = 'Wrong passcode.'; return; }
  VGP.setRater(name);
  VGP.setPassOk();
  location.href = next;
});
</script>
</body>
</html>
