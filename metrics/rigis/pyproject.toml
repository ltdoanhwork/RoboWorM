[project]
name = "vggt"
version = "0.0.1"
description = "VGGT / VGGT-Omega multiview consistency metrics for video generation."
requires-python = ">=3.10"
authors = [{name = "Jianyuan Wang", email = "jianyuan@robots.ox.ac.uk"}]
dependencies = [
    # Core runtime for multiview_consistency.model_service / run_video_metrics
    "torch>=2.3.1",
    "torchvision>=0.18.1",
    "numpy<2",
    "Pillow",
    "huggingface_hub",
    "einops",
    "safetensors",
    "opencv-python",
    "matplotlib",
]

[project.optional-dependencies]
demo = [
    "gradio==5.17.1",
    "viser==0.2.23",
    "tqdm",
    "hydra-core",
    "omegaconf",
    "scipy",
    "onnxruntime",
    "requests",
    "trimesh",
]

[project.scripts]
vggt-model-service = "multiview_consistency.model_service:serve_forever"
vggt-run-video-metrics = "multiview_consistency.run_video_metrics:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["vggt*", "multiview_consistency*"]

# Prefer CUDA wheels on Linux (matches A100 / cu126 hosts). Override with UV_INDEX or
# `uv sync --index-url` if you need a different CUDA build.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

# Pixi configuration
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
vggt = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
demo = { features = ["demo"], solve-group = "default" }

[tool.pixi.tasks]
